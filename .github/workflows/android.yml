name: Android APK

on:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar Capacitor
        run: npm ci

      - name: Sincronizar proyecto Android
        run: npx cap sync android

      - name: Compilar APK (debug)
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: spootify-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
